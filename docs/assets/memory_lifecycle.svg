<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 440" width="100%" height="100%" style="background:#090d16;font-family:Inter,system-ui,-apple-system,sans-serif">
  <!-- Background Grid -->
  <pattern id="grid3" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  </pattern>
  <rect width="950" height="440" fill="url(#grid3)"/>

  <!-- Title Header -->
  <text x="475" y="42" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="800">CORTEX MEMORY LIFECYCLE &amp; BACKGROUND CONSOLIDATION</text>
  <text x="475" y="65" text-anchor="middle" fill="#94a3b8" font-size="12">Captura Pasiva, Indexación Vectorial, Reorganización de Grafos y Resolución de Conflictos</text>

  <!-- Cycle Node 1: Capture & Observations -->
  <g transform="translate(60, 110)">
    <rect width="180" height="230" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="90" y="32" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="700">1. Captura &amp; Handoff</text>
    <text x="20" y="70" fill="#cbd5e1" font-size="11">• Sesiones de desarrollo</text>
    <text x="20" y="95" fill="#cbd5e1" font-size="11">• Decisiones &amp; Bugfixes</text>
    <text x="20" y="120" fill="#cbd5e1" font-size="11">• Captura pasiva / activa</text>
    <text x="20" y="145" fill="#cbd5e1" font-size="11">• Idempotency Keys</text>
    <text x="20" y="170" fill="#cbd5e1" font-size="11">• Scoring inicial</text>
  </g>

  <!-- Arrow -->
  <path d="M 250 225 L 280 225" stroke="#3b82f6" stroke-width="2"/>

  <!-- Cycle Node 2: Vector Embedding & Hybrid Search -->
  <g transform="translate(290, 110)">
    <rect width="180" height="230" rx="12" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="90" y="32" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="700">2. Vector &amp; Búsqueda</text>
    <text x="20" y="70" fill="#cbd5e1" font-size="11">• Embeddings Gemini/OpenAI</text>
    <text x="20" y="95" fill="#cbd5e1" font-size="11">• Indexación pgvector/Qdrant</text>
    <text x="20" y="120" fill="#cbd5e1" font-size="11">• Búsqueda Híbrida BM25</text>
    <text x="20" y="145" fill="#cbd5e1" font-size="11">• Fusión Recency+Score</text>
    <text x="20" y="170" fill="#cbd5e1" font-size="11">• Recuperación por Hop</text>
  </g>

  <!-- Arrow -->
  <path d="M 480 225 L 510 225" stroke="#8b5cf6" stroke-width="2"/>

  <!-- Cycle Node 3: Autonomous AI Workers -->
  <g transform="translate(520, 110)">
    <rect width="180" height="230" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="90" y="32" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="700">3. AI Workers</text>
    <text x="20" y="70" fill="#cbd5e1" font-size="11">• Reorganización de Grafo</text>
    <text x="20" y="95" fill="#cbd5e1" font-size="11">• Detección de Contradicciones</text>
    <text x="20" y="120" fill="#cbd5e1" font-size="11">• Supersedes dinámico</text>
    <text x="20" y="145" fill="#cbd5e1" font-size="11">• Consolidación episódica</text>
    <text x="20" y="170" fill="#cbd5e1" font-size="11">• Limpieza de huérfanos</text>
  </g>

  <!-- Arrow -->
  <path d="M 710 225 L 740 225" stroke="#10b981" stroke-width="2"/>

  <!-- Cycle Node 4: Governance & Project Rules -->
  <g transform="translate(750, 110)">
    <rect width="150" height="230" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="75" y="32" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="700">4. Gobernanza</text>
    <text x="15" y="70" fill="#cbd5e1" font-size="11">• Reglas de Negocio</text>
    <text x="15" y="95" fill="#cbd5e1" font-size="11">• System Prompts</text>
    <text x="15" y="120" fill="#cbd5e1" font-size="11">• MCP Skills</text>
    <text x="15" y="145" fill="#cbd5e1" font-size="11">• BOLA Defense</text>
    <text x="15" y="170" fill="#cbd5e1" font-size="11">• Multi-Tenant RLS</text>
  </g>

  <!-- Loop back path -->
  <path d="M 825 350 L 825 385 L 150 385 L 150 350" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,6"/>
  <text x="475" y="380" text-anchor="middle" fill="#94a3b8" font-size="11">Ciclo de Vida Continuo: El conocimiento evoluciona y se retroalimenta</text>
</svg>
