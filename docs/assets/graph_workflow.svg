<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%" style="background:#090d16;font-family:Inter,system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Background Grid -->
  <pattern id="grid2" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  </pattern>
  <rect width="950" height="480" fill="url(#grid2)"/>

  <!-- Title Header -->
  <text x="475" y="42" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="800">CORTEX PROJECT-CENTRIC GRAPH WORKFLOW</text>
  <text x="475" y="65" text-anchor="middle" fill="#94a3b8" font-size="12">Mapeo de Código, Detección de Comunidades, Blast Radius y Exportación a Obsidian</text>

  <!-- Step 1: Code Ingestion & AST -->
  <g transform="translate(50, 110)">
    <rect width="180" height="280" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="90" cy="45" r="24" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="90" y="50" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="bold">1</text>
    <text x="90" y="95" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">AST Extractor</text>
    <text x="90" y="115" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="600">ZERO-CGO GO PARSER</text>
    
    <text x="20" y="150" fill="#cbd5e1" font-size="10">• .go, .ts, .js, .py, .sql</text>
    <text x="20" y="175" fill="#cbd5e1" font-size="10">• Módulos, Clases, Funcs</text>
    <text x="20" y="200" fill="#cbd5e1" font-size="10">• Imports &amp; Call Graph</text>
    <text x="20" y="225" fill="#cbd5e1" font-size="10">• Reconciliación Upsert</text>
    <text x="20" y="250" fill="#cbd5e1" font-size="10">• Persistencia PostgreSQL</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 240 250 L 270 250" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Louvain Clustering -->
  <g transform="translate(280, 110)">
    <rect width="180" height="280" rx="12" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="90" cy="45" r="24" fill="#4c1d95" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="90" y="50" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="bold">2</text>
    <text x="90" y="95" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">Comunidades</text>
    <text x="90" y="115" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600">LOUVAIN / LEIDEN</text>

    <text x="20" y="150" fill="#cbd5e1" font-size="10">• Partición de subsistemas</text>
    <text x="20" y="175" fill="#cbd5e1" font-size="10">• Etiquetado por Hubs</text>
    <text x="20" y="200" fill="#cbd5e1" font-size="10">• Cohesión interna</text>
    <text x="20" y="225" fill="#cbd5e1" font-size="10">• Colores por módulo</text>
    <text x="20" y="250" fill="#cbd5e1" font-size="10">• Filtrado interactivo</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 470 250 L 500 250" stroke="#8b5cf6" stroke-width="2.5"/>

  <!-- Step 3: Architectural Diagnostics -->
  <g transform="translate(510, 110)">
    <rect width="180" height="280" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="90" cy="45" r="24" fill="#78350f" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="90" y="50" text-anchor="middle" fill="#fde68a" font-size="14" font-weight="bold">3</text>
    <text x="90" y="95" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">Diagnóstico</text>
    <text x="90" y="115" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">GOD NODES &amp; BLAST</text>

    <text x="20" y="150" fill="#cbd5e1" font-size="10">• God Nodes (Bottlenecks)</text>
    <text x="20" y="175" fill="#cbd5e1" font-size="10">• Conexiones Sorprendentes</text>
    <text x="20" y="200" fill="#cbd5e1" font-size="10">• Tarjan SCC Cycles</text>
    <text x="20" y="225" fill="#cbd5e1" font-size="10">• Blast Radius %</text>
    <text x="20" y="250" fill="#cbd5e1" font-size="10">• Archivos impactados</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 700 250 L 730 250" stroke="#f59e0b" stroke-width="2.5"/>

  <!-- Step 4: Web UI & Obsidian Export -->
  <g transform="translate(740, 110)">
    <rect width="160" height="280" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="80" cy="45" r="24" fill="#064e3b" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="80" y="50" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="bold">4</text>
    <text x="80" y="95" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">Visualización</text>
    <text x="80" y="115" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600">WEB UI &amp; OBSIDIAN</text>

    <text x="15" y="150" fill="#cbd5e1" font-size="10">• Canvas 2D 60 FPS</text>
    <text x="15" y="175" fill="#cbd5e1" font-size="10">• Radar Minimap HUD</text>
    <text x="15" y="200" fill="#cbd5e1" font-size="10">• Selector de Proyecto</text>
    <text x="15" y="225" fill="#cbd5e1" font-size="10">• [[WikiLinks]] Vault</text>
    <text x="15" y="250" fill="#cbd5e1" font-size="10">• JSON Export</text>
  </g>

  <!-- Bottom Summary Badge -->
  <g transform="translate(250, 420)">
    <rect width="450" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="225" y="23" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">✓ Integrado con MCP Server (Cursor, Claude Code, Cline) y REST API</text>
  </g>
</svg>
