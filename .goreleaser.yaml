version: 2

# Global before hooks run exactly once, before any build target starts, so the
# Next.js static export is synced into internal/web/dist before go:embed
# packages the real UI into every release binary. Per-build `builds[].hooks.pre`
# would run make web-build once per target (six times) in parallel and race on
# the shared dist tree, so the single global hook is the correct mechanism here.
before:
  hooks:
    - make web-build

builds:
  - main: ./cmd/cortex
    binary: cortex
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    tags:
      - cortex_vectors
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "cortex_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# One syft SBOM per archive artifact; syft must be on PATH at release time
# (release.yml installs the pinned version before GoReleaser runs).
sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    include:
      - "^feat"
      - "^fix"
      - "^refactor"
      - "^perf"
    exclude:
      - "^docs"
      - "^test"
      - "^ci"
      - "^chore\\(deps\\)"

brews:
  - repository:
      owner: lleontor705
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/lleontor705/cortex"
    description: "Persistent memory for AI coding agents — knowledge graph, importance scoring, vector search"
    license: "MIT"
    commit_msg_template: "chore: update cortex formula to {{ .Tag }}"
