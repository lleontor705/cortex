services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cortex_bootstrap
      POSTGRES_PASSWORD: cortex_bootstrap
      POSTGRES_DB: cortex_test
    volumes:
      - cortex-postgres:/var/lib/postgresql/data
      - ./scripts/postgres/bootstrap-authz.sql:/docker-entrypoint-initdb.d/001-bootstrap-authz.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex_bootstrap -d cortex_test"]
      interval: 5s
      timeout: 5s
      retries: 12

  cortex-server:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["--mode", "server"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CORTEX_SERVER_STORAGE_DRIVER: postgres
      CORTEX_SERVER_STORAGE_DSN: postgres://cortex_test:cortex_test@postgres:5432/cortex_test?sslmode=disable
      CORTEX_SERVER_STORAGE_MIGRATION_DSN: postgres://cortex_bootstrap:cortex_bootstrap@postgres:5432/cortex_test?sslmode=disable
      CORTEX_SERVER_TENANT_ID: "00000000-0000-0000-0000-000000000001"
      CORTEX_SERVER_WORKSPACE_ID: "00000000-0000-0000-0000-000000000002"
      CORTEX_SERVER_PRINCIPAL_SUBJECT: "00000000-0000-0000-0000-000000000003"
      CORTEX_SERVER_GRANT_DIGEST: docker-development-grant
      CORTEX_SERVER_GRANT_VERSION: "1"
      CORTEX_SERVER_BOOTSTRAP_DEVELOPMENT: "true"
      CORTEX_HTTP_ENABLED: "true"
      CORTEX_HTTP_HOST: 0.0.0.0
      CORTEX_HTTP_PORT: "7438"
      CORTEX_HTTP_TOKEN: docker-development-token
      CORTEX_HTTP_ALLOWED_ORIGINS: http://localhost:5173
      CORTEX_SERVER_PROVIDER_VECTOR: none
      CORTEX_SEARCH_EMBEDDING_PROVIDER: none
      CORTEX_LIFECYCLE_ENABLE_AUTO_ARCHIVE: "false"
    ports:
      - "7438:7438"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7438/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  cortex-postgres:
