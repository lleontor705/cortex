<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" fill="none">
  <defs>
    <linearGradient id="neural" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bb9af7"/>
      <stop offset="50%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#2ac3de"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ac3de" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#16161e" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2ac3de" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="260" rx="16" fill="#16161e"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.05" stroke="#7aa2f7" stroke-width="0.5">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
  </g>

  <!-- Brain icon -->
  <g transform="translate(60, 50)" filter="url(#shadow)">
    <!-- Left hemisphere -->
    <path d="M80 20 C50 20, 20 45, 20 80 C20 115, 45 145, 80 145"
          stroke="url(#neural)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Right hemisphere -->
    <path d="M80 20 C110 20, 140 45, 140 80 C140 115, 115 145, 80 145"
          stroke="url(#neural)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Brain folds left -->
    <path d="M40 55 C55 50, 65 60, 60 75" stroke="#bb9af7" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M35 90 C50 85, 65 95, 55 110" stroke="#bb9af7" stroke-width="2" fill="none" opacity="0.7"/>
    <!-- Brain folds right -->
    <path d="M120 55 C105 50, 95 60, 100 75" stroke="#7aa2f7" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M125 90 C110 85, 95 95, 105 110" stroke="#7aa2f7" stroke-width="2" fill="none" opacity="0.7"/>
    <!-- Central connection -->
    <line x1="80" y1="30" x2="80" y2="140" stroke="#2ac3de" stroke-width="1.5" opacity="0.4"/>

    <!-- Neural nodes -->
    <circle cx="45" cy="55" r="4" fill="#bb9af7" opacity="0.9"/>
    <circle cx="60" cy="80" r="4" fill="#7aa2f7" opacity="0.9"/>
    <circle cx="40" cy="105" r="4" fill="#bb9af7" opacity="0.9"/>
    <circle cx="115" cy="55" r="4" fill="#7aa2f7" opacity="0.9"/>
    <circle cx="100" cy="80" r="4" fill="#2ac3de" opacity="0.9"/>
    <circle cx="120" cy="105" r="4" fill="#7aa2f7" opacity="0.9"/>
    <circle cx="80" cy="65" r="5" fill="#2ac3de"/>
    <circle cx="80" cy="100" r="5" fill="#2ac3de"/>

    <!-- Neural connections (knowledge graph) -->
    <line x1="45" y1="55" x2="60" y2="80" stroke="#bb9af7" stroke-width="1" opacity="0.5"/>
    <line x1="60" y1="80" x2="80" y2="65" stroke="#7aa2f7" stroke-width="1" opacity="0.5"/>
    <line x1="80" y1="65" x2="100" y2="80" stroke="#2ac3de" stroke-width="1" opacity="0.5"/>
    <line x1="100" y1="80" x2="115" y2="55" stroke="#7aa2f7" stroke-width="1" opacity="0.5"/>
    <line x1="40" y1="105" x2="80" y2="100" stroke="#bb9af7" stroke-width="1" opacity="0.5"/>
    <line x1="80" y1="100" x2="120" y2="105" stroke="#7aa2f7" stroke-width="1" opacity="0.5"/>
    <line x1="80" y1="65" x2="80" y2="100" stroke="#2ac3de" stroke-width="1.5" opacity="0.6"/>
    <line x1="45" y1="55" x2="80" y2="100" stroke="#bb9af7" stroke-width="0.8" opacity="0.3"/>
    <line x1="115" y1="55" x2="80" y2="100" stroke="#7aa2f7" stroke-width="0.8" opacity="0.3"/>
  </g>

  <!-- CORTEX text -->
  <text x="240" y="125" font-family="'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', monospace" font-size="72" font-weight="bold" letter-spacing="8">
    <tspan fill="url(#neural)">CORTEX</tspan>
  </text>

  <!-- Tagline -->
  <text x="245" y="165" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="16" fill="#565f89" letter-spacing="3">
    PERSISTENT MEMORY FOR AI CODING AGENTS
  </text>

  <!-- Feature pills -->
  <g transform="translate(245, 190)">
    <rect x="0" y="0" width="130" height="26" rx="13" fill="#bb9af7" fill-opacity="0.15" stroke="#bb9af7" stroke-width="1" stroke-opacity="0.3"/>
    <text x="65" y="17" font-family="monospace" font-size="11" fill="#bb9af7" text-anchor="middle">Knowledge Graph</text>

    <rect x="145" y="0" width="100" height="26" rx="13" fill="#7aa2f7" fill-opacity="0.15" stroke="#7aa2f7" stroke-width="1" stroke-opacity="0.3"/>
    <text x="195" y="17" font-family="monospace" font-size="11" fill="#7aa2f7" text-anchor="middle">Vector Search</text>

    <rect x="260" y="0" width="115" height="26" rx="13" fill="#2ac3de" fill-opacity="0.15" stroke="#2ac3de" stroke-width="1" stroke-opacity="0.3"/>
    <text x="317" y="17" font-family="monospace" font-size="11" fill="#2ac3de" text-anchor="middle">Single Go Binary</text>

    <rect x="390" y="0" width="85" height="26" rx="13" fill="#9ece6a" fill-opacity="0.15" stroke="#9ece6a" stroke-width="1" stroke-opacity="0.3"/>
    <text x="432" y="17" font-family="monospace" font-size="11" fill="#9ece6a" text-anchor="middle">Local-First</text>
  </g>

  <!-- Glow line at bottom -->
  <rect x="0" y="254" width="800" height="6" rx="0" fill="url(#glow)"/>
</svg>
