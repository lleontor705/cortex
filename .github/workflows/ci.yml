name: CI

# NOTE: actions are pinned to full commit SHAs with a trailing version comment
# (ratchet pattern). .github/dependabot.yml keeps them current through the
# github-actions ecosystem, which bumps each SHA and its version comment together.

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_call:

permissions:
  contents: read

jobs:
  gates:
    name: Shared Gates
    uses: ./.github/workflows/ci-reusable.yml
    secrets: inherit

  changelog:
    name: Changelog
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          set -euo pipefail
          GIT_CLIFF_VERSION=2.14.2
          asset="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "${base}/${asset}"
          curl -fsSLO "${base}/${asset}.sha512"
          expected="$(grep -oE '[0-9a-fA-F]{128}' "${asset}.sha512" | head -n 1)"
          actual="$(sha512sum "${asset}" | awk '{print $1}')"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error title=Checksum mismatch::sha512 verification failed for ${asset}"
            exit 1
          fi
          mkdir -p git-cliff-extract
          tar -xzf "${asset}" -C git-cliff-extract
          sudo install -m 0755 "$(find git-cliff-extract -type f -name git-cliff | head -n 1)" /usr/local/bin/git-cliff
          git-cliff --version

      - name: Refresh versioned sections in CHANGELOG.md
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/changelog"
          mkdir -p "$work"
          git-cliff --output "$work/generated.md"
          awk '/^## \[[0-9]/{keep=1} keep {
                 if ($0 ~ /^## \[/ && prev != "") print ""
                 print
                 prev=$0
               }' "$work/generated.md" > "$work/versions.md"
          test -s "$work/versions.md"
          awk '/^## \[[0-9]/{exit} {print}' CHANGELOG.md > "$work/maintained.md"
          tail -n 1 "$work/maintained.md" | grep -q '^$' || echo >> "$work/maintained.md"
          cat "$work/maintained.md" "$work/versions.md" > CHANGELOG.md

      - name: Commit refreshed changelog
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already reflects the release history."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(changelog): refresh release history [skip ci]"
          git push origin HEAD

  docker-compose-smoke-test:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: docs i18n status
        continue-on-error: true
        run: bash scripts/check-doc-i18n.sh

      - name: Start stack with Docker Compose
        timeout-minutes: 15
        run: docker compose up --build -d

      - name: Wait for services to be healthy
        timeout-minutes: 10
        run: |
          ATTEMPTS=60
          DELAY=5
          echo "Waiting up to $((ATTEMPTS * DELAY))s for the stack to become healthy..."
          for attempt in $(seq 1 "$ATTEMPTS"); do
            SERVER_STATUS=$(docker inspect --format='{{.State.Health.Status}}' cortex-cortex-server-1 2>/dev/null || echo "missing")
            UI_STATUS=$(curl -fsS -o /dev/null http://localhost:7438/ 2>/dev/null && echo "healthy" || echo "unreachable")
            DB_STATUS=$(docker inspect --format='{{.State.Health.Status}}' cortex-postgres-1 2>/dev/null || echo "missing")
            echo "[attempt $attempt/$ATTEMPTS] db=$DB_STATUS server=$SERVER_STATUS ui=$UI_STATUS"
            if [ "$SERVER_STATUS" = "healthy" ] && [ "$UI_STATUS" = "healthy" ] && [ "$DB_STATUS" = "healthy" ]; then
              echo "All services healthy after ~$(( (attempt - 1) * DELAY ))s of polling."
              exit 0
            fi
            sleep "$DELAY"
          done
          echo "::error::Stack did not become healthy within $((ATTEMPTS * DELAY))s of polling."
          echo "docker compose ps -a:"
          docker compose ps -a
          echo "docker compose logs (last 100 lines per service):"
          docker compose logs --no-color --tail 100
          exit 1

      - name: Verify health endpoints
        run: |
          curl -fsS http://localhost:7438/health || exit 1
          curl -fsS http://localhost:7438/ | grep -qi '<!DOCTYPE html>\|<html' || exit 1

      - name: Teardown stack
        if: always()
        run: docker compose down -v

  playwright-e2e:
    name: Playwright E2E (Embedded Web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/e2e-web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.1"

      - name: Build and sync embedded web assets
        run: make web-build

      - name: Install Playwright harness dependencies
        working-directory: tools/e2e-web
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: tools/e2e-web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e suite
        working-directory: tools/e2e-web
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-e2e-report
          path: tools/e2e-web/playwright-report
          if-no-files-found: warn

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-e2e-traces
          path: tools/e2e-web/test-results
          if-no-files-found: warn

  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-file: go.mod
