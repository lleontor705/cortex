name: CI

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run unit tests
        run: go test -v -count=1 ./...

  obsidian-path-portability:
    name: Obsidian Path Portability (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Assert portability test contract
        shell: bash
        run: |
          set -euo pipefail
          test -f internal/projection/obsidian/writer_test.go
          grep -q 'TestSafeSlugRejectsWindowsDeviceBasenamesBeforeFirstDot' internal/projection/obsidian/writer_test.go
          grep -q 'TestCanonicalPathKeyCollapsesWindowsDeviceExtensionsAndVariants' internal/projection/obsidian/writer_test.go

      - name: Run focused Obsidian/path portability tests
        run: go test -v -count=1 ./internal/projection/obsidian -run 'Test(SafeSlug|CanonicalPathKey|ExportCanonicalCollision|ExportRejectsCaseInsensitiveCollision)'

  coverage:
    name: Global Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Enforce whole-project coverage threshold
        shell: bash
        run: |
          set -euo pipefail
          go test -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
          total_line="$(go tool cover -func coverage.out | awk '$1 == "total:" { print $3; exit }')"
          total="${total_line%%%}"
          awk -v coverage="$total" 'BEGIN {
            if (coverage < 70.0) {
              printf "global coverage %.2f%% is below 70.0%%\n", coverage
              exit 1
            }
            printf "global coverage %.2f%% meets 70.0%% threshold\n", coverage
          }'

  baseline-contracts:
    name: Offline Retrieval Baseline Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Validate deterministic baseline contracts
        run: go test -v -count=1 ./bench ./bench/common ./bench/cortex ./bench/fixtures/cortex-native ./bench/cortex/cmd/baseline

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run e2e tests
        run: go test -v -count=1 -tags integration ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

  race-detector:
    name: Race Detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run race detector on concurrent stores
        run: go test -race -count=1 ./internal/store/search ./internal/store/bundle ./internal/mcp
