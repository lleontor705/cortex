name: Release

# NOTE: actions are pinned to full commit SHAs with a trailing version comment
# (ratchet pattern). .github/dependabot.yml keeps them current through the
# github-actions ecosystem, which bumps each SHA and its version comment together.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create (e.g. v0.3.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  gates:
    name: Shared Gates
    uses: ./.github/workflows/ci-reusable.yml
    secrets: inherit

  # ── Stage 2: Manual approval gate ──────────────────────────────────────
  approve-release:
    name: Approve Release
    runs-on: ubuntu-latest
    needs: [gates]
    environment: production
    steps:
      - name: Approval confirmed
        run: echo "Release approved — proceeding to publish."

  # ── Stage 3: Build and publish release ─────────────────────────────────
  goreleaser:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: approve-release
    # Job-level permissions replace the workflow defaults, so the inherited
    # scopes are restated explicitly; id-token: write is the OIDC switch that
    # lets cosign request a short-lived Fulcio certificate (keyless signing).
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Ordering guarantee for embedded assets: build and sync the Next.js
      # export before the tag is pushed and before GoReleaser compiles anything.
      # This runs upstream of setup-go/GoReleaser so a broken web export aborts
      # the release before any Go artifact (or tag) is produced.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and sync embedded web assets
        run: make web-build

      - name: Verify embedded web export is present
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f web/out/index.html ] || [ ! -f internal/web/dist/index.html ]; then
            echo "::error title=Missing embedded web export::web/out/index.html or internal/web/dist/index.html is absent; refusing to build release artifacts."
            exit 1
          fi

      # Manual dispatch only: the tag for push events already exists, and a tag
      # pushed with GITHUB_TOKEN never re-triggers workflows, so this run is the
      # single owner of tag creation in the dispatch path.
      - name: Create dispatch tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error title=Missing tag::workflow_dispatch requires a version tag input."
            exit 1
          fi
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping tag creation."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.1"

      # GoReleaser shells out to syft for the per-archive SBOMs declared in
      # .goreleaser.yaml; without this install the publish step fails at runtime.
      - name: Install syft for SBOM generation
        run: |
          set -euo pipefail
          SYFT_VERSION=1.54.0
          asset="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "${base}/${asset}"
          curl -fsSLO "${base}/syft_${SYFT_VERSION}_checksums.txt"
          expected="$(grep "${asset}\$" "syft_${SYFT_VERSION}_checksums.txt" | grep -oE '[0-9a-fA-F]{64}' | head -n 1)"
          actual="$(sha256sum "${asset}" | awk '{print $1}')"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error title=Checksum mismatch::sha256 verification failed for ${asset}"
            exit 1
          fi
          tar -xzf "${asset}" syft
          sudo install -m 0755 syft /usr/local/bin/syft
          syft version

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing after GoReleaser published the release: each artifact
      # gets a self-contained Sigstore bundle (certificate + signature + Rekor
      # entry), so verification needs no stored key material or extra registry.
      - name: Sign release archives and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/checksums.txt dist/*.tar.gz dist/*.zip)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error title=Nothing to sign::GoReleaser left no archives or checksums.txt in dist/."
            exit 1
          fi
          bundles=()
          for asset in "${assets[@]}"; do
            bundle="${asset}.sigstore"
            cosign sign-blob --yes --bundle "$bundle" "$asset"
            bundles+=("$bundle")
          done
          gh release upload "$TAG" "${bundles[@]}" --clobber

      - name: Verify published signature bundle
        shell: bash
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle "dist/checksums.txt.sigstore" \
            --certificate-identity-regexp "https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "dist/checksums.txt"

  docker-publish-server:
    name: Build & Publish Server Docker Image
    runs-on: ubuntu-latest
    needs: [approve-release, goreleaser]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push Server Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
