name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create (e.g. v0.3.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ── Stage 1: Run full test suite ───────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Run unit tests
        run: go test -v -count=1 ./...

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cortex_test
          POSTGRES_PASSWORD: cortex_test
          POSTGRES_DB: cortex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cortex_test -d cortex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CORTEX_TEST_POSTGRES_DSN: postgres://cortex_test:cortex_test@localhost:5432/cortex_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Run e2e tests
        run: go test -v -count=1 -tags "integration postgres_integration" ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

  # ── Stage 2: Manual approval gate ──────────────────────────────────────
  approve-release:
    name: Approve Release
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests, lint]
    environment: production
    steps:
      - name: Approval confirmed
        run: echo "Release approved — proceeding to publish."

  # ── Stage 3: Build and publish release ─────────────────────────────────
  goreleaser:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: approve-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            # Auto-bump: latest tag + patch increment
            latest=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            IFS='.' read -r major minor patch <<< "${latest#v}"
            patch=$((patch + 1))
            echo "version=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        run: |
          TAG="${{ steps.tag.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping tag creation."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
