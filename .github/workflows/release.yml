name: Release

# NOTE: actions are pinned by major tag (not commit SHA) so dependabot keeps
# them current. Full SHA pinning is a known follow-up and would require the
# dependabot configuration to be updated in the same change to avoid silently
# freezing these mutable references.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create (e.g. v0.3.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  # ── Stage 1: Run full test suite ───────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Compile all packages
        run: go build ./...

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          if ! go test -v -count=1 ./... > unit_test.log 2>&1; then
            FAILED_TESTS=$(grep -E "^(FAIL|--- FAIL|panic:)" unit_test.log | head -n 10 | tr '\n' ' | ' || echo "unknown")
            echo "::error title=Failed Unit Tests::$FAILED_TESTS"
            cat unit_test.log
            exit 1
          fi

  vector-tests:
    name: Vector-enabled Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Run vector-enabled tests
        shell: bash
        run: |
          set -o pipefail
          if ! go test -v -count=1 -tags cortex_vectors ./... > vector_test.log 2>&1; then
            FAILED_TESTS=$(grep -E "^(FAIL|--- FAIL|panic:)" vector_test.log | head -n 10 | tr '\n' ' | ' || echo "unknown")
            echo "::error title=Failed Vector Tests::$FAILED_TESTS"
            cat vector_test.log
            exit 1
          fi

  web-tests:
    name: Web Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Enforce web client-core coverage
        run: npm run test:coverage

      - name: Upload web coverage report
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: web/coverage
          if-no-files-found: error

      - name: Build production application
        run: npm run build

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cortex_bootstrap
          POSTGRES_PASSWORD: cortex_bootstrap
          POSTGRES_DB: cortex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cortex_bootstrap -d cortex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GOFLAGS: "-p=1"
      CORTEX_TEST_POSTGRES_DSN: postgres://cortex_test:cortex_test@localhost:5432/cortex_test?sslmode=disable
      CORTEX_TEST_POSTGRES_MIGRATION_DSN: postgres://cortex_bootstrap:cortex_bootstrap@localhost:5432/cortex_test?sslmode=disable
      CORTEX_TEST_POSTGRES_AUTHZ_ADMIN_DSN: postgres://cortex_admin_login:cortex_admin_login@localhost:5432/cortex_test?sslmode=disable
      CORTEX_SPIKE_PG_ADMIN_DSN: postgres://cortex_bootstrap:cortex_bootstrap@localhost:5432/cortex_test?sslmode=disable
      CORTEX_SPIKE_PGBOUNCER_DSN: postgres://cortex_bootstrap:cortex_bootstrap@localhost:5432/cortex_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Create non-superuser application and authorization logins
        run: |
          PGPASSWORD=cortex_bootstrap psql "postgres://cortex_bootstrap@localhost:5432/cortex_test" -v ON_ERROR_STOP=1 -f scripts/postgres/bootstrap-authz.sql

      - name: Run e2e tests
        shell: bash
        run: |
          set -o pipefail
          if ! go test -v -count=1 -tags "integration postgres_integration" ./... > e2e_test.log 2>&1; then
            grep -B 1 -A 5 -E "^(--- FAIL:|panic:)" e2e_test.log | head -n 50 | while IFS= read -r line; do
              echo "::error title=E2E Failure::$line"
            done
            cat e2e_test.log
            exit 1
          fi

      - name: Run Docker Compose boundary E2E tests
        run: go test -v -count=1 -tags docker_e2e ./e2e

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

  race-detector:
    name: Race Detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Run race detector on concurrent stores
        run: go test -race -count=1 ./internal/store/search ./internal/store/bundle ./internal/mcp

  coverage:
    name: Global Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cortex_bootstrap
          POSTGRES_PASSWORD: cortex_bootstrap
          POSTGRES_DB: cortex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cortex_bootstrap -d cortex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GOFLAGS: "-p=1"
      CORTEX_TEST_POSTGRES_DSN: postgres://cortex_test:cortex_test@localhost:5432/cortex_test?sslmode=disable
      CORTEX_TEST_POSTGRES_MIGRATION_DSN: postgres://cortex_bootstrap:cortex_bootstrap@localhost:5432/cortex_test?sslmode=disable
      CORTEX_TEST_POSTGRES_AUTHZ_ADMIN_DSN: postgres://cortex_admin_login:cortex_admin_login@localhost:5432/cortex_test?sslmode=disable
      CORTEX_SPIKE_PG_ADMIN_DSN: postgres://cortex_bootstrap:cortex_bootstrap@localhost:5432/cortex_test?sslmode=disable
      CORTEX_SPIKE_PGBOUNCER_DSN: postgres://cortex_bootstrap:cortex_bootstrap@localhost:5432/cortex_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Create non-superuser application and authorization logins
        run: |
          PGPASSWORD=cortex_bootstrap psql "postgres://cortex_bootstrap@localhost:5432/cortex_test" -v ON_ERROR_STOP=1 -f scripts/postgres/bootstrap-authz.sql

      - name: Enforce whole-project coverage threshold
        shell: bash
        run: |
          set -euo pipefail
          if ! go test -tags postgres_integration -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./... > coverage.log 2>&1; then
            grep -B 1 -A 5 -E "^(--- FAIL:|panic:)" coverage.log | head -n 50 | while IFS= read -r line; do
              echo "::error title=Coverage Test Failure::$line"
            done
            cat coverage.log
            exit 1
          fi
          total_line="$(go tool cover -func coverage.out | awk '$1 == "total:" { print $3; exit }')"
          total="${total_line%%%}"
          awk -v coverage="$total" 'BEGIN {
            if (coverage < 70.0) {
              printf "global coverage %.2f%% is below 70.0%%\n", coverage
              exit 1
            }
            printf "global coverage %.2f%% meets 70.0%% threshold\n", coverage
          }'

      - name: Upload Go coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage.log
          if-no-files-found: warn

  baseline-contracts:
    name: Offline Retrieval Baseline Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Validate deterministic baseline contracts
        run: go test -v -count=1 ./bench ./bench/common ./bench/cortex ./bench/fixtures/cortex-native ./bench/cortex/cmd/baseline

  obsidian-path-portability:
    name: Obsidian Path Portability (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Assert portability test contract
        shell: bash
        run: |
          set -euo pipefail
          test -f internal/projection/obsidian/writer_test.go
          grep -q 'TestSafeSlugRejectsWindowsDeviceBasenamesBeforeFirstDot' internal/projection/obsidian/writer_test.go
          grep -q 'TestWindowsDeviceNameNearMissesAreNotReservedOrColliding' internal/projection/obsidian/writer_test.go
          grep -q 'TestCanonicalPathKeyCollapsesWindowsDeviceExtensionsAndVariants' internal/projection/obsidian/writer_test.go

      - name: Run focused Obsidian/path portability tests
        run: go test -v -count=1 ./internal/projection/obsidian -run 'Test(SafeSlug|WindowsDeviceNameNearMisses|CanonicalPathKey|ExportCanonicalCollision|ExportRejectsCaseInsensitiveCollision)'

  plugin-opencode:
    name: Plugin Tests (OpenCode)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin/opencode
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: plugin/opencode/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run plugin contract tests
        run: npm test

  plugin-claude-code:
    name: Plugin Tests (Claude Code)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install harness dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bash jq python3 coreutils

      - name: Verify harness toolchain
        run: |
          for tool in bash jq python3 timeout; do
            command -v "$tool" >/dev/null 2>&1 || {
              echo "missing required harness tool: $tool" >&2
              exit 127
            }
          done

      - name: Run hooks contract harness
        run: bash plugin/claude-code/scripts/hooks_test.sh

  # ── Stage 2: Manual approval gate ──────────────────────────────────────
  approve-release:
    name: Approve Release
    runs-on: ubuntu-latest
    needs: [build, unit-tests, vector-tests, web-tests, e2e-tests, lint, race-detector, coverage, baseline-contracts, obsidian-path-portability, plugin-opencode, plugin-claude-code]
    environment: production
    steps:
      - name: Approval confirmed
        run: echo "Release approved — proceeding to publish."

  # ── Stage 3: Build and publish release ─────────────────────────────────
  goreleaser:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: approve-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            # Auto-bump: latest tag + patch increment
            latest=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            IFS='.' read -r major minor patch <<< "${latest#v}"
            patch=$((patch + 1))
            echo "version=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        run: |
          TAG="${{ steps.tag.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping tag creation."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  docker-publish-server:
    name: Build & Publish Server Docker Image
    runs-on: ubuntu-latest
    needs: [approve-release, goreleaser]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push Server Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-publish-web:
    name: Build & Publish Web UI Docker Image
    runs-on: ubuntu-latest
    needs: [approve-release, goreleaser]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push Web UI Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
